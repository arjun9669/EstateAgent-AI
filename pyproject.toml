[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-agent-ai"
version = "0.1.0"
description = "Agentic RAG assistant for the Dubai property market"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arjun Kumar" }]
requires-python = ">=3.11"
# Agent and UI dependencies are added in later milestones (see PLAN.md).
dependencies = ["chromadb>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["model: needs the real embedding model (set RUN_MODEL_TESTS=1)"]
