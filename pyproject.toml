[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-agent-ai"
version = "0.1.0"
description = "Agentic RAG assistant for the Dubai property market"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arjun Kumar" }]
requires-python = ">=3.11"
# The UI dependency is added in milestone 4 (see PLAN.md).
dependencies = [
    "chromadb>=1.5,<2",
    "gradio>=6.30,<7",
    "streamlit>=1.65,<2",
    "langchain-core>=1.6.9,<2",
    "langchain-groq>=1.1.3,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2.14,<1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["model: needs the real embedding model (set RUN_MODEL_TESTS=1)"]
