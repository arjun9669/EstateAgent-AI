name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Sample data is reproducible
        run: |
          python scripts/generate_sample_data.py
          git diff --exit-code data/sample
      - run: pytest -q

  deploy:
    # Copies the app to the Hugging Face Space after tests pass on main.
    # Needs the HF_TOKEN secret (write token) and the HF_SPACE_ID variable
    # (owner/space-name); skipped with a notice until both exist.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-space
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Check deploy settings
        id: settings
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::notice::Skipping deploy: set the HF_TOKEN secret and HF_SPACE_ID variable (see docs/HOSTING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.settings.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Upload to the Space
        if: steps.settings.outputs.ready == 'true'
        run: |
          pip install "huggingface_hub==2.2.0"
          python scripts/deploy_space.py "$HF_SPACE_ID"
